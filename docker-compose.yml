version: '3.8'

services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false

  ngrok:
    image: wernight/ngrok
    container_name: ngrok
    depends_on:
      - jenkins
    environment:
      - NGROK_AUTH=358zBaTiOkbO3Z1ZFtISS1DAf1c_5i6TG8TfwhsG2c9ETgYbp
      - NGROK_PORT=jenkins:8080
    command: http jenkins:8080

volumes:
  jenkins_home:
